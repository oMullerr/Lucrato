name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Com limiar de cobertura: o piso está em jest.config.js e existe para
      # travar regressão. Cair abaixo dele reprova o PR.
      - run: npm run test:coverage
      - run: npm run build
      # Auditoria estática de celular e acessibilidade. Os dois eixos estão
      # aqui pela mesma razão: falham em SILÊNCIO. Token de cor inexistente
      # vira `inherit` sem erro, e botão sem nome acessível funciona perfeito
      # para quem enxerga — nenhum dos dois aparece num teste de comportamento.
      - run: node scripts/audit-mobile.mjs

      # Contraste calculado a partir dos tokens, nos dois temas. Escolher a cor
      # não é o mesmo que conferi-la: a primeira rodada desta auditoria reprovou
      # 7 pares que pareciam seguros a olho nu.
      - run: node scripts/audit-contraste.mjs

  # As functions rodam no servidor e mexem em token e em dinheiro — ficarem
  # fora do CI era a lacuna maior. Projeto separado, `npm ci` próprio.
  functions:
    name: Functions · Test · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # As security rules são o arquivo que protege o dado, e eram o único teste do
  # repositório que NÃO rodava no CI — exigem o emulador do Firestore, e por isso
  # ficaram de fora. Uma regra frouxa passaria despercebida até alguém notar que
  # passou.
  rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # O emulador do Firestore do firebase-tools 15 exige Java 21. E o
      # `firebase` não vem instalado aqui: o `test:rules` o chama por `npx`,
      # com versão fixa. Este job nasceu passando só na máquina de quem o
      # escreveu, que tinha as duas coisas instaladas globalmente — e a
      # primeira execução no CI (23/09/2026) falhou com `firebase: not found`.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run test:rules

  audit:
    name: Dependency audit (informativo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Informativo: reporta vulnerabilidades de PRODUÇÃO sem bloquear o merge.
      # Hoje há advisories conhecidas em deps transitivas do SDK Firebase
      # (undici via @firebase/functions e @firebase/storage — recursos que este
      # app não usa). Reavaliar ao atualizar o pacote `firebase`. Mantido como
      # não-bloqueante para não travar PRs legítimos; revise a saída a cada PR.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
