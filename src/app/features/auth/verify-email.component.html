<div class="verify-page">
  <div class="verify-card surface-card">
    <div class="icon-wrap">
      <app-icon name="mail-warning" [size]="28" />
    </div>

    <h1>{{ 'auth.verifyTitle' | translate }}</h1>
    <p class="lead">
      {{ 'auth.verifyLeadBefore' | translate }}
      <strong>{{ email() || ('auth.emailFallback' | translate) }}</strong>{{ 'auth.verifyLeadAfter' | translate }}
    </p>

    <div class="hint">
      <app-icon name="info" [size]="18" />
      <span>{{ 'auth.verifyHint' | translate }}</span>
    </div>

    <div class="actions">
      <button
        appBtn
        type="button"
        (click)="checkAgain()"
        [loading]="checking()"
      >
        <app-icon name="refresh-cw" [size]="18" />
        {{ 'auth.alreadyVerified' | translate }}
      </button>

      <button
        appBtn="outline"
        type="button"
        (click)="resend()"
        [loading]="resending()"
        [disabled]="cooldown() > 0"
      >
        <app-icon name="send" [size]="18" />
        @if (cooldown() > 0) {
          {{ 'auth.resendIn' | translate:{ s: cooldown() } }}
        } @else {
          {{ 'auth.resendEmail' | translate }}
        }
      </button>
    </div>

    <button appBtn="ghost" size="sm" type="button" class="logout-link" (click)="logout()">
      {{ 'auth.logoutOther' | translate }}
    </button>
  </div>
</div>
