@if (items().length) {
  <ul class="item-list">
    @for (item of items(); track item; let i = $index, first = $first, last = $last) {
      <li class="item-row">
        @if (withColor()) {
          <input
            type="color"
            class="color-swatch"
            [value]="colorOf(item)"
            (input)="setColor(item, $any($event.target).value)"
            [attr.aria-label]="'editableList.colorOf' | translate:{ item: item }"
          />
        }
        <span class="item-name">{{ item }}</span>
        <div class="item-actions">
          <button
            appBtn="ghost" iconOnly size="sm"
            type="button"
            class="reorder-btn"
            (click)="move(i, -1)"
            [disabled]="first"
            [attr.aria-label]="'editableList.moveUp' | translate"
          >
            <app-icon name="arrow-up" [size]="16" />
          </button>
          <button
            appBtn="ghost" iconOnly size="sm"
            type="button"
            class="reorder-btn"
            (click)="move(i, 1)"
            [disabled]="last"
            [attr.aria-label]="'editableList.moveDown' | translate"
          >
            <app-icon name="arrow-down" [size]="16" />
          </button>
          <button
            appBtn="ghost" iconOnly size="sm"
            type="button"
            class="remove-btn"
            (click)="remove(i)"
            [attr.aria-label]="'common.remove' | translate"
          >
            <app-icon name="x" [size]="16" />
          </button>
        </div>
      </li>
    }
  </ul>
} @else {
  <p class="empty-hint">{{ 'editableList.noItems' | translate }}</p>
}

<div class="add-row">
  @if (withColor()) {
    <input
      type="color"
      class="color-swatch add-swatch"
      [(ngModel)]="draftColor"
      [attr.aria-label]="'editableList.newColor' | translate"
    />
  }
  <app-field class="add-field" [label]="addLabel()">
    <input
      appInput
      [(ngModel)]="draft"
      [placeholder]="placeholder() || ('editableList.placeholder' | translate)"
      (keydown.enter)="$event.preventDefault(); add()"
    />
    <button fieldSuffix appBtn="ghost" iconOnly size="sm" type="button" (click)="add()" [attr.aria-label]="'common.add' | translate">
      <app-icon name="plus" [size]="16" />
    </button>
  </app-field>
</div>
