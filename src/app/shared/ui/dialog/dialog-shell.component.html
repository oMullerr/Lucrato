<header class="dialog-header">
  @if (icon(); as ic) {
    <span class="dialog-icon" [class.dialog-icon--danger]="tone() === 'danger'" aria-hidden="true">
      <app-icon [name]="ic" [size]="20" />
    </span>
  }
  <h2 class="dialog-title">{{ dialogTitle() }}</h2>
  <ng-content select="[dialogBadge]" />
  <button
    appBtn="ghost"
    iconOnly
    size="sm"
    type="button"
    class="dialog-close"
    [disabled]="busy()"
    (click)="requestClose()"
    [attr.aria-label]="'common.close' | translate"
  >
    <app-icon name="x" [size]="18" />
  </button>
</header>

<div class="dialog-body">
  <ng-content />
</div>

<footer class="dialog-actions">
  <ng-content select="[dialogActions]" />
</footer>
